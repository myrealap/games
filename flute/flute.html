<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flute</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .flute-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .flute-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    .hole {
      position: absolute;
      cursor: pointer;
      pointer-events: auto;
      border: none;
      outline: none;
      background: transparent;
    }
    
    .note-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 250%;
      height: 250%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    
    .note-overlay.hover {
      opacity: 0.7;
    }
    
    .note-overlay.clicked {
      opacity: 1;
      transition: opacity 0.1s ease;
    }
    
    .note-overlay.clicked.fade-out {
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    /* Pattern playback - no ugly box! just a subtle pulse */
    .hole.pattern-active {
      animation: patternPulse 0.4s ease-out;
    }
    @keyframes patternPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="flute-container" id="fluteContainer">
    <img class="flute-img" src="../images/flute.png" alt="Flute">
    
    <div class="hole" id="hole1" style="left: 26.25%; top: 47.5%; width: 4%; height: 4%;" data-note="1">
      <div class="note-overlay" id="overlay1" style="background-image: url('../images/note_hover.png');"></div>
    </div>
    <div class="hole" id="hole2" style="left: 33.5%; top: 47.5%; width: 4%; height: 4%;" data-note="2">
      <div class="note-overlay" id="overlay2" style="background-image: url('../images/note_hover.png');"></div>
    </div>
    <div class="hole" id="hole3" style="left: 40.8%; top: 47.5%; width: 4%; height: 4%;" data-note="3">
      <div class="note-overlay" id="overlay3" style="background-image: url('../images/note_hover.png');"></div>
    </div>
    <div class="hole" id="hole4" style="left: 48%; top: 47.5%; width: 4%; height: 4%;" data-note="4">
      <div class="note-overlay" id="overlay4" style="background-image: url('../images/note_hover.png');"></div>
    </div>
    <div class="hole" id="hole5" style="left: 55.2%; top: 47.5%; width: 4%; height: 4%;" data-note="5">
      <div class="note-overlay" id="overlay5" style="background-image: url('../images/note_hover.png');"></div>
    </div>
    <div class="hole" id="hole6" style="left: 62.7%; top: 47.5%; width: 4%; height: 4%;" data-note="6">
      <div class="note-overlay" id="overlay6" style="background-image: url('../images/note_hover.png');"></div>
    </div>
    <div class="hole" id="hole7" style="left: 70%; top: 47.5%; width: 4%; height: 4%;" data-note="7">
      <div class="note-overlay" id="overlay7" style="background-image: url('../images/note_hover.png');"></div>
    </div>
    <div class="hole" id="hole8" style="left: 77.5%; top: 47.5%; width: 4%; height: 4%;" data-note="8">
      <div class="note-overlay" id="overlay8" style="background-image: url('../images/note_hover.png');"></div>
    </div>
  </div>

  <script>
    const noteAudio = {};
    for (let i = 1; i <= 8; i++) {
      noteAudio[i] = new Audio(`../sounds/notes/note${i}.wav`);
      noteAudio[i].volume = 0.7;
    }

    const holes = document.querySelectorAll('.hole');
    const overlays = {};
    holes.forEach(hole => {
      const note = hole.dataset.note;
      const overlay = document.getElementById(`overlay${note}`);
      overlays[note] = overlay;
      
      hole.addEventListener('mouseenter', function(e) {
        const overlay = overlays[this.dataset.note];
        if (overlay) {
          overlay.classList.remove('clicked', 'fade-out');
          overlay.classList.add('hover');
        }
      });
      
      hole.addEventListener('mouseleave', function(e) {
        const overlay = overlays[this.dataset.note];
        if (overlay) {
          overlay.classList.remove('hover');
        }
      });
      
      hole.addEventListener('click', function(e) {
        e.stopPropagation();
        const note = parseInt(this.dataset.note);
        const overlay = overlays[this.dataset.note];
        
        // Play sound and show clicked image
        playNote(note, true); // true = user click, show clicked image
        
        if (overlay) {
          overlay.style.backgroundImage = `url('../images/note${note}_clicked.png')`;
          overlay.classList.remove('hover');
          overlay.classList.add('clicked');
          
          setTimeout(() => {
            overlay.classList.add('fade-out');
          }, 300);
          
          setTimeout(() => {
            overlay.classList.remove('clicked', 'fade-out');
            overlay.style.backgroundImage = `url('../images/note_hover.png')`;
          }, 700);
        }
      });
    });

    function playNote(noteNum, showClicked = false) {
      const audio = noteAudio[noteNum];
      if (audio) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }
      
      // Highlight the hole
      const hole = document.getElementById(`hole${noteNum}`);
      if (hole) {
        hole.classList.remove('pattern-active');
        void hole.offsetWidth;
        hole.classList.add('pattern-active');
        setTimeout(() => hole.classList.remove('pattern-active'), 400);
      }
      
      // If this is from pattern playback, show clicked image
      if (!showClicked) {
        const overlay = overlays[noteNum];
        if (overlay) {
          overlay.style.backgroundImage = `url('../images/note${noteNum}_clicked.png')`;
          overlay.classList.remove('hover');
          overlay.classList.add('clicked');
          
          setTimeout(() => {
            overlay.classList.add('fade-out');
          }, 300);
          
          setTimeout(() => {
            overlay.classList.remove('clicked', 'fade-out');
            overlay.style.backgroundImage = `url('../images/note_hover.png')`;
          }, 700);
        }
      }
      
      // Notify parent (which forwards to animals)
      window.parent.postMessage({
        action: 'notePlayed',
        note: noteNum
      }, '*');
    }

    // Keyboard support - works without clicking flute!
    document.addEventListener('keydown', function(e) {
      const key = parseInt(e.key);
      if (key >= 1 && key <= 8) {
        // Check if not typing in input
        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
          e.preventDefault();
          const hole = document.getElementById(`hole${key}`);
          if (hole) {
            hole.click();
          }
        }
      }
    });

    // Listen for pattern playback from animals (via parent)
    window.addEventListener('message', function(event) {
      const data = event.data;
      if (data.action === 'playNote') {
        const note = data.note;
        // Play without showing clicked image (just highlight)
        const audio = noteAudio[note];
        if (audio) {
          audio.currentTime = 0;
          audio.play().catch(() => {});
        }
        // Highlight the hole
        const hole = document.getElementById(`hole${note}`);
        if (hole) {
          hole.classList.remove('pattern-active');
          void hole.offsetWidth;
          hole.classList.add('pattern-active');
          setTimeout(() => hole.classList.remove('pattern-active'), 400);
        }
        // Show clicked image for pattern too
        const overlay = overlays[note];
        if (overlay) {
          overlay.style.backgroundImage = `url('../images/note${note}_clicked.png')`;
          overlay.classList.remove('hover');
          overlay.classList.add('clicked');
          
          setTimeout(() => {
            overlay.classList.add('fade-out');
          }, 300);
          
          setTimeout(() => {
            overlay.classList.remove('clicked', 'fade-out');
            overlay.style.backgroundImage = `url('../images/note_hover.png')`;
          }, 700);
        }
      }
    });

    // Make sure flute gets focus for keyboard events
    document.addEventListener('DOMContentLoaded', function() {
      document.body.setAttribute('tabindex', '0');
      document.body.focus();
    });

    // Click on flute container to focus
    document.getElementById('fluteContainer').addEventListener('click', function() {
      document.body.focus();
    });

    window.parent.postMessage({ action: 'fluteReady' }, '*');
  </script>
</body>
</html>
