<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Myrealap - Flute Memory Game</title>
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <style>
    iframe { cursor: none !important; }
    * { cursor: none !important; }
  </style>
</head>
<body>

  <!-- CONTAINERS -->
  <div class="mouse-trail-container" id="mouseTrailContainer"></div>
  <div class="touch-sparkle-container" id="touchSparkleContainer"></div>
  <div class="falling-sparkle-container" id="fallingSparkleContainer"></div>
  <div class="global-sparkle-container" id="globalSparkleContainer"></div>
  <div class="white-fade" id="whiteFade"></div>

  <!-- LOADING SCREEN -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-bg" id="loadingBg"></div>
    <div class="quote-container">
      <div class="quote-bg"></div>
      <div class="quote-text" id="quoteText">" music is the poetry of the air "</div>
      <div class="quote-author" id="quoteAuthor">— myrealap</div>
    </div>
  </div>
  <div class="loading-action-area" id="loadingActionArea">
    <div class="loading-percentage" id="loadingPercent">0%</div>
    <button class="go-button" id="goButton"></button>
  </div>

  <!-- ===== MAIN SCREEN CONTAINER ===== -->
  <div class="main-screen" id="mainScreen">
    
    <!-- BACKGROUND (stays the same) -->
    <div class="main-bg" id="mainBg"></div>
    <div class="main-sparkle-overlay" id="mainSparkleOverlay"></div>

    <!-- ===== LANDING CONTENT ===== -->
    <div class="screen-content landing-content" id="landingContent">
      <img class="content-image landing-image" src="images/landing.png" alt="Myrealap Flute Memory Game">
      <button class="content-btn landing-btn" id="playButton"></button>
    </div>

    <!-- ===== HELP CONTENT ===== -->
    <div class="screen-content help-content" id="helpContent">
      <img class="content-image help-image" src="images/help.png" alt="Help Guide">
      <button class="content-btn help-btn" id="helpPlayButton"></button>
    </div>

    <!-- ===== SELECTOR CONTENT ===== -->
    <div class="screen-content selector-content" id="selectorContent">
      <img class="content-image selector-image" src="images/selector.png" alt="Select Game Mode">
      <h2>Choose Your Game Mode</h2>
      <button class="content-btn selector-free-btn" id="freePlayBtn"></button>
      <button class="content-btn selector-game-btn" id="gameModeBtn"></button>
    </div>

  </div>

  <!-- GAME SCREEN -->
  <div class="game-screen" id="gameScreen">
    <div class="game-sparkle-overlay" id="gameSparkleOverlay"></div>

    <!-- Animals Viewer (contains bg_game) -->
    <iframe id="animalsViewer" src="animals/animals.html" allow="autoplay"></iframe>

    <!-- Flute Viewer -->
    <iframe id="fluteViewer" src="flute/flute.html" allow="autoplay"></iframe>

    <!-- Me Viewer -->
    <iframe id="meViewer" src="me/me.html" allow="autoplay"></iframe>

    <!-- Help Button -->
    <button class="help-btn-game" id="helpBtnGame"></button>

    <!-- Bottom Buttons -->
    <div class="bottom-btns">
      <button class="startover-btn" id="startoverBtn"></button>
    </div>
  </div>

  <!-- In-game Help Overlay -->
  <div class="game-help-overlay" id="gameHelpOverlay">
    <img class="game-help-image" src="images/help.png" alt="Help Guide">
    <button class="game-help-close-btn" id="gameHelpCloseBtn"></button>
  </div>

  <div class="footer">© 2026 Myrealap. All Rights Reserved.</div>

  <script src="js/script.js"></script>
</body>
</html>
