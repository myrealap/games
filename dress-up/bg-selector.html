<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BG Selector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      width: 500px;
      height: 310px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: 'ChaletRegular', Arial, sans-serif;
    }

    .bg-label {
      position: relative;
      width: 200px;
      height: 40px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(2px 0px 10px black);
    }

    .bg-label img {
      position: absolute;
      left: -25%;
      top: 40%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .bg-label img.active {
      opacity: 1;
    }

    .bg-label img.fade-out {
      opacity: 0;
    }

    .bg-selector-container {
      position: relative;
      width: 500px;
      height: 250px;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .bg-selector-container:hover {
      transform: scale(1.05);
    }

    .bg-selector {
      width: 500px;
      height: 250px;
      background-image: url('images/bg_btn.png');
      background-repeat: no-repeat;
      background-position: 0 0;
      background-size: 1000px 250px;
      cursor: pointer;
      border: none;
      background-color: transparent;
      padding: 0;
      position: relative;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-position 0.3s ease;
      overflow: hidden;
    }

    .bg-selector:hover {
      background-position: -500px 0;
    }

    .bg-selector:active {
      transform: scale(0.95);
    }

    .bg-selector .thumb-wrapper {
      width: 100%;
      height: 100%;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg-selector .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
      opacity: 1;
      position: absolute;
      top: 0;
      left: 0;
    }

    .bg-selector .thumb-wrapper img.hidden {
      opacity: 0;
    }

    /* Hover state for thumbnails */
    .bg-selector .thumb-wrapper img.thumb-hover {
      opacity: 0;
    }

    .bg-selector-container:hover .thumb-wrapper img.thumb-hover {
      opacity: 1;
    }

    .bg-selector-container:hover .thumb-wrapper img.thumb-normal {
      opacity: 0;
    }

    /* When not hovered, show normal */
    .bg-selector-container:not(:hover) .thumb-wrapper img.thumb-normal {
      opacity: 1;
    }

    .bg-selector-container:not(:hover) .thumb-wrapper img.thumb-hover {
      opacity: 0;
    }

    /* Responsive */
    @media (max-width: 768px) {}

    @media (max-width: 480px) {}
  </style>
</head>
<body>
  <div class="bg-label" id="bgLabel">
    <img id="titleMermaid" class="active" src="images/bg_title_mermaid.png" alt="Mermaid Backgrounds">
    <img id="titleFairy" src="images/bg_title_fairy.png" alt="Fairy Backgrounds">
    <img id="titleBoy" src="images/bg_title_boy.png" alt="Boy Backgrounds">
  </div>
  <div class="bg-selector-container" id="bgContainer">
    <button class="bg-selector" id="bgSelector">
      <div class="thumb-wrapper" id="thumbWrapper">
        <img id="thumbNormal" class="thumb-normal" src="" alt="BG Thumbnail">
        <img id="thumbHover" class="thumb-hover" src="" alt="BG Thumbnail Hover">
      </div>
    </button>
  </div>

  <script>
    // ========== CONFIGURATION ==========
    const totalBgs = 9; // 9 backgrounds total
    let currentThumb = 1; // Start with thumb1 (Mermaid's first bg)
    let isTransitioning = false;
    let isTitleTransitioning = false;
    let currentCharacter = 'mermaid';
    
    // Character ranges for backgrounds
    const characterBgRange = {
      'mermaid': { start: 1, end: 3 },
      'fairy': { start: 4, end: 6 },
      'human': { start: 7, end: 9 }
    };

    // Get character from background number
    function getCharacterFromBg(bgNumber) {
      if (bgNumber >= 1 && bgNumber <= 3) return 'mermaid';
      if (bgNumber >= 4 && bgNumber <= 6) return 'fairy';
      if (bgNumber >= 7 && bgNumber <= 9) return 'human';
      return 'mermaid';
    }

    // Get first background for a character
    function getFirstBgForCharacter(character) {
      const range = characterBgRange[character];
      return range ? range.start : 1;
    }

    // Get next background within the same character range
    function getNextBgForCharacter(currentBg, character) {
      const range = characterBgRange[character];
      if (!range) return currentBg;
      
      let next = currentBg + 1;
      if (next > range.end) next = range.start;
      return next;
    }

    const thumbNormal = document.getElementById('thumbNormal');
    const thumbHover = document.getElementById('thumbHover');
    const btn = document.getElementById('bgSelector');
    const container = document.getElementById('bgContainer');

    // Title images
    const titleMermaid = document.getElementById('titleMermaid');
    const titleFairy = document.getElementById('titleFairy');
    const titleBoy = document.getElementById('titleBoy');
    const allTitles = [titleMermaid, titleFairy, titleBoy];

    // Character to title mapping
    const titleMap = {
      'mermaid': 'titleMermaid',
      'fairy': 'titleFairy',
      'human': 'titleBoy'
    };

    // Set thumb to show a specific background number
    function setThumb(bgNumber) {
      // Ensure bgNumber is a valid number (1-9)
      const num = parseInt(bgNumber);
      if (isNaN(num) || num < 1 || num > totalBgs) {
        console.warn('Invalid bgNumber:', bgNumber, 'using default 1');
        bgNumber = 1;
      }
      
      thumbNormal.src = `images/bg/thumb${bgNumber}.png`;
      thumbHover.src = `images/bg/thumb${bgNumber}_hover.png`;
      thumbNormal.dataset.bg = bgNumber;
      thumbHover.dataset.bg = bgNumber;
    }

    // Set title based on character with fade
    function setTitle(character, callback) {
      if (isTitleTransitioning) return;
      isTitleTransitioning = true;

      const titleId = titleMap[character];
      if (!titleId) {
        isTitleTransitioning = false;
        if (callback) callback();
        return;
      }

      // Find target and current active title
      let targetTitle = null;
      let currentActive = null;

      allTitles.forEach(img => {
        if (img.id === titleId) {
          targetTitle = img;
        }
        if (img.classList.contains('active')) {
          currentActive = img;
        }
      });

      // If already showing this title
      if (currentActive === targetTitle) {
        isTitleTransitioning = false;
        if (callback) callback();
        return;
      }

      // Fade out current
      if (currentActive) {
        currentActive.classList.remove('active');
        currentActive.classList.add('fade-out');
      }

      // After fade out, show new title
      setTimeout(() => {
        if (currentActive) {
          currentActive.classList.remove('fade-out');
        }
        
        if (targetTitle) {
          targetTitle.classList.add('active');
        }

        setTimeout(() => {
          isTitleTransitioning = false;
          if (callback) callback();
        }, 600);
      }, 600);
    }

    // Set initial thumb - start with thumb1 (Mermaid's first bg)
    setThumb(currentThumb);

    // Set initial title
    setTimeout(() => {
      setTitle('mermaid');
    }, 100);

    function changeBg() {
      if (isTransitioning) return;
      isTransitioning = true;

      // Get current thumb number
      let currentThumbNumber = parseInt(thumbNormal.dataset.bg);
      
      // Get current character based on bg number
      let currentChar = getCharacterFromBg(currentThumbNumber);
      
      // Calculate next thumb within the same character range
      let nextThumb = getNextBgForCharacter(currentThumbNumber, currentChar);
      
      // Fade out
      thumbNormal.classList.add('hidden');
      thumbHover.classList.add('hidden');
      
      setTimeout(() => {
        // Update thumb
        setThumb(nextThumb);
        currentThumb = nextThumb;
        
        // Fade in
        setTimeout(() => {
          thumbNormal.classList.remove('hidden');
          thumbHover.classList.remove('hidden');
        }, 50);
        
        setTimeout(() => {
          isTransitioning = false;
        }, 700);
      }, 500);

      // Notify parent - send the CURRENT thumb number as the background to change to
      window.parent.postMessage({
        action: 'changeBg',
        bgNumber: currentThumb
      }, '*');
    }

    // Click event
    btn.addEventListener('click', changeBg);
    container.addEventListener('click', changeBg);

    // Listen for updates from parent (when character changes)
    window.addEventListener('message', function(event) {
      const data = event.data;
      
      if (data.action === 'updateBgThumb') {
        const thumbNumber = data.nextThumb;
        // Validate the thumb number (1-9)
        if (thumbNumber >= 1 && thumbNumber <= totalBgs) {
          setThumb(thumbNumber);
          currentThumb = thumbNumber;
          thumbNormal.classList.remove('hidden');
          thumbHover.classList.remove('hidden');
          
          // Update current character based on the bg number
          currentCharacter = getCharacterFromBg(thumbNumber);
        }
      }

      // Handle character change for title
      if (data.action === 'updateCharacter') {
        const character = data.character;
        if (character && character !== currentCharacter) {
          currentCharacter = character;
          setTitle(character);
          
          // Also update the thumbnail to the first bg of this character
          const firstBg = getFirstBgForCharacter(character);
          setThumb(firstBg);
          currentThumb = firstBg;
          thumbNormal.classList.remove('hidden');
          thumbHover.classList.remove('hidden');
          
          // Send the updated bg to parent
          window.parent.postMessage({
            action: 'changeBg',
            bgNumber: firstBg
          }, '*');
        }
      }
    });

    // Tell parent we're ready
    window.parent.postMessage({ action: 'bgSelectorReady' }, '*');
  </script>
</body>
</html>
