<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Music box · myrealap</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: transparent;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'ChaletRegular', Arial, sans-serif;
      overflow: hidden;
    }

    .music-box {
      width: 800px;
      height: 500px;
      background-size: 90% 80%;
      background-repeat: no-repeat;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background-image 0.6s ease;
    }
    .music-box.mermaid { background-image: url('images/music_mermaid.png'); }
    .music-box.fairy { background-image: url('images/music_fairy.png'); }
    .music-box.boy { background-image: url('images/music_boy.png'); }

    /* ===== MUSIC TITLE ===== */
    .music-title {
      position: absolute;
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 13%;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .music-title img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .music-title img.active { opacity: 1; }
    .music-title img.fade-out { opacity: 0; }

    /* ===== FLOATING NOTES – like sparkle but with note.png ===== */
    .notes-ring {
      position: absolute;
      top: 30%;
      left: 20%;
      width: 60%;
      height: 40%;
      pointer-events: none;
      z-index: 1;
      overflow: visible;
    }

    .float-note {
      position: absolute;
      width: 32px;
      height: 32px;
      background-image: url('images/note.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 0 12px rgba(255, 215, 200, 0.7));
      animation: noteFloat 3.2s ease-in-out infinite alternate;
    }

    /* Each note placed in a ring around the melody */
    .float-note:nth-child(1) { top: 8%; left: 50%; animation-delay: 0.0s; width: 38px; height: 38px; }
    .float-note:nth-child(2) { top: 50%; left: 88%; animation-delay: 0.5s; width: 30px; height: 30px; }
    .float-note:nth-child(3) { top: 85%; left: 50%; animation-delay: 1.0s; width: 44px; height: 44px; }
    .float-note:nth-child(4) { top: 50%; left: 12%; animation-delay: 1.5s; width: 28px; height: 28px; }
    .float-note:nth-child(5) { top: 20%; left: 22%; animation-delay: 0.8s; width: 36px; height: 36px; }
    .float-note:nth-child(6) { top: 20%; left: 78%; animation-delay: 1.3s; width: 32px; height: 32px; }
    .float-note:nth-child(7) { top: 78%; left: 22%; animation-delay: 0.3s; width: 40px; height: 40px; }
    .float-note:nth-child(8) { top: 78%; left: 78%; animation-delay: 1.8s; width: 26px; height: 26px; }
    .float-note:nth-child(9) { top: 12%; left: 12%; animation-delay: 0.6s; width: 34px; height: 34px; }
    .float-note:nth-child(10) { top: 12%; left: 88%; animation-delay: 1.1s; width: 30px; height: 30px; }
    .float-note:nth-child(11) { top: 88%; left: 12%; animation-delay: 0.9s; width: 42px; height: 42px; }
    .float-note:nth-child(12) { top: 88%; left: 88%; animation-delay: 1.9s; width: 28px; height: 28px; }

    @keyframes noteFloat {
      0% {
        opacity: 0.15;
        transform: translateY(-18px) scale(0.7) rotate(-8deg);
      }
      25% {
        opacity: 0.9;
        transform: translateY(6px) scale(1.2) rotate(6deg);
      }
      50% {
        opacity: 1;
        transform: translateY(-10px) scale(1) rotate(-3deg);
      }
      75% {
        opacity: 0.8;
        transform: translateY(14px) scale(0.9) rotate(4deg);
      }
      100% {
        opacity: 0.2;
        transform: translateY(-22px) scale(0.7) rotate(-6deg);
      }
    }

    /* ----- PREV / NEXT BUTTONS ----- */
    .music-btn {
      position: absolute;
      top: 62%;
      transform: translateY(-50%);
      width: 200px;
      height: 200px;
      background-size: 160px 80px;
      background-repeat: no-repeat;
      background-position: 0 0;
      border: none;
      background-color: transparent;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s;
      z-index: 10;
    }
    .music-btn:hover {
      transform: translateY(-50%) scale(1.1);
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
    }
    .music-btn:active { transform: translateY(-50%) scale(0.95); }
    .music-btn.prev {
      left: 20%;
      background-image: url('images/prev-song.png');
    }
    .music-btn.next {
      right: 15%;
      background-image: url('images/next-song.png');
    }

    /* ----- MELODY BUTTON (center) ----- */
    .melody-btn {
      width: 300px;
      height: 300px;
      background-image: url('images/melody.png');
      background-size: 600px 300px;
      background-repeat: no-repeat;
      background-position: 0 0;
      border: none;
      background-color: transparent;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
      position: relative;
      z-index: 5;
      border-radius: 50%;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.15));
      transform: scale(1);
    }
    .melody-btn:hover {
      transform: scale(1.06);
      filter: drop-shadow(0 0px 14px #e9149170);
    }
    .melody-btn.muted {
      background-image: url('images/melody_mute.png');
      background-size: 600px 300px;
      background-position: 0 0;
    }
    .melody-btn.muted:hover {
      background-position: -300px 0;
      transform: scale(1.06);
    }

    /* ===== SPARKLE DOTS (extra magic) ===== */
    .sparkle-dot {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 215, 200, 0.2);
      width: 6px;
      height: 6px;
      filter: blur(1px);
      animation: sparklePulse 3.5s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }
    .sparkle-dot:nth-child(1) { top: 8%; left: 8%; animation-delay: 0.2s; width: 10px; height: 10px; }
    .sparkle-dot:nth-child(2) { top: 8%; right: 8%; animation-delay: 1.4s; }
    .sparkle-dot:nth-child(3) { bottom: 8%; left: 8%; animation-delay: 0.8s; width: 12px; height: 12px; }
    .sparkle-dot:nth-child(4) { bottom: 8%; right: 8%; animation-delay: 2s; }
    .sparkle-dot:nth-child(5) { top: 3%; left: 50%; animation-delay: 0.5s; width: 6px; height: 6px; }
    .sparkle-dot:nth-child(6) { bottom: 3%; left: 50%; animation-delay: 1.7s; width: 8px; height: 8px; }
    .sparkle-dot:nth-child(7) { top: 50%; left: 3%; animation-delay: 1.1s; }
    .sparkle-dot:nth-child(8) { top: 50%; right: 3%; animation-delay: 2.3s; }

    @keyframes sparklePulse {
      0% { opacity: 0.1; transform: scale(0.5); }
      100% { opacity: 0.7; transform: scale(1.3); }
    }

    /* ===== EXPLOSION BURST NOTES (when music plays) ===== */
    .explosion-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      overflow: visible;
    }
    .explosion-note {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 30px;
      height: 30px;
      background-image: url('images/note.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 0 25px rgba(255, 215, 200, 0.9));
      animation: explosionBurst 2s ease-out forwards;
    }
    @keyframes explosionBurst {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.1) rotate(0deg);
      }
      8% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(2) rotate(30deg);
      }
      25% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.4) rotate(70deg);
      }
      50% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(0.9) rotate(120deg);
      }
      80% {
        opacity: 0.5;
        transform: translate(-50%, -50%) scale(0.5) rotate(180deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.1) rotate(240deg);
      }
    }

    @media (max-width: 768px) {
      .music-box { width: 95vw; height: 70vw; }
      .melody-btn { width: 40vw; height: 40vw; background-size: 80vw 40vw; }
      .music-btn { width: 30vw; height: 30vw; background-size: 24vw 12vw; }
      .music-btn.prev { left: 5%; }
      .music-btn.next { right: 5%; }
      .float-note { width: 4vw !important; height: 4vw !important; }
      .float-note:nth-child(1) { width: 5vw !important; height: 5vw !important; }
      .float-note:nth-child(3) { width: 6vw !important; height: 6vw !important; }
      .float-note:nth-child(5) { width: 4.5vw !important; height: 4.5vw !important; }
      .float-note:nth-child(7) { width: 5.5vw !important; height: 5.5vw !important; }
      .float-note:nth-child(9) { width: 4.8vw !important; height: 4.8vw !important; }
      .float-note:nth-child(11) { width: 5.8vw !important; height: 5.8vw !important; }
      .explosion-note { width: 4vw; height: 4vw; }
    }
    @media (max-width: 480px) {
      .music-box { width: 98vw; height: 80vw; }
      .melody-btn { width: 45vw; height: 45vw; background-size: 90vw 45vw; }
      .music-btn { width: 28vw; height: 28vw; background-size: 22vw 11vw; }
      .music-btn.prev { left: 2%; }
      .music-btn.next { right: 2%; }
    }
  </style>
</head>
<body>
  <div class="music-box mermaid" id="musicBox">
    <!-- Music Title -->
    <div class="music-title" id="musicTitle">
      <img id="titleMermaid" class="active" src="images/music_title_mermaid.png" alt="Mermaid Music" />
      <img id="titleFairy" src="images/music_title_fairy.png" alt="Fairy Music" />
      <img id="titleBoy" src="images/music_title_boy.png" alt="Boy Music" />
    </div>

    <!-- ===== FLOATING NOTES RING (always visible, like sparkle) ===== -->
    <div class="notes-ring" id="notesRing">
      <div class="float-note"></div>
      <div class="float-note"></div>
      <div class="float-note"></div>
      <div class="float-note"></div>
      <div class="float-note"></div>
      <div class="float-note"></div>
      <div class="float-note"></div>
      <div class="float-note"></div>
      <div class="float-note"></div>
      <div class="float-note"></div>
      <div class="float-note"></div>
      <div class="float-note"></div>
    </div>

    <!-- Prev / Next -->
    <button class="music-btn prev" id="musicPrev" aria-label="Previous"></button>
    <button class="music-btn next" id="musicNext" aria-label="Next"></button>

    <!-- Melody Button (center) -->
    <button class="melody-btn melody" id="melodyBtn" aria-label="Toggle mute"></button>
  </div>

  <script>
    let explosionInterval = null;
    let isMusicPlaying = false;
    let isTitleTransitioning = false;
    let currentCharacter = 'mermaid';

    // Title images
    const titleMermaid = document.getElementById('titleMermaid');
    const titleFairy = document.getElementById('titleFairy');
    const titleBoy = document.getElementById('titleBoy');
    const allTitles = [titleMermaid, titleFairy, titleBoy];
    const titleMap = {
      'mermaid': 'titleMermaid',
      'fairy': 'titleFairy',
      'boy': 'titleBoy',
      'human': 'titleBoy'
    };

    // ========== SET TITLE WITH FADE ==========
    function setMusicTitle(character, callback) {
      if (isTitleTransitioning) return;
      isTitleTransitioning = true;

      const titleId = titleMap[character];
      if (!titleId) {
        isTitleTransitioning = false;
        if (callback) callback();
        return;
      }

      let targetTitle = null;
      let currentActive = null;

      allTitles.forEach(img => {
        if (img.id === titleId) targetTitle = img;
        if (img.classList.contains('active')) currentActive = img;
      });

      if (currentActive === targetTitle) {
        isTitleTransitioning = false;
        if (callback) callback();
        return;
      }

      if (currentActive) {
        currentActive.classList.remove('active');
        currentActive.classList.add('fade-out');
      }

      setTimeout(() => {
        if (currentActive) currentActive.classList.remove('fade-out');
        if (targetTitle) targetTitle.classList.add('active');
        setTimeout(() => {
          isTitleTransitioning = false;
          if (callback) callback();
        }, 600);
      }, 600);
    }

    // ========== INITIAL TITLE ==========
    setTimeout(() => setMusicTitle('mermaid'), 100);

    // ========== EXPLOSION BURST ==========
    function spawnExplosion() {
      const container = document.getElementById('explosionContainer');
      const angles = [];
      for (let i = 0; i < 24; i++) angles.push(i * 15);
      const distances = [100, 130, 160, 190, 220, 250, 280, 310, 340, 370];

      angles.forEach((angle) => {
        const note = document.createElement('div');
        note.className = 'explosion-note';
        const distance = distances[Math.floor(Math.random() * distances.length)];
        const radian = (angle * Math.PI) / 180;
        const x = Math.cos(radian) * distance;
        const y = Math.sin(radian) * distance;
        note.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        const size = 22 + Math.random() * 30;
        note.style.width = size + 'px';
        note.style.height = size + 'px';
        const delay = Math.random() * 0.2;
        note.style.animationDelay = delay + 's';
        note.style.animationDuration = (1.8 + Math.random() * 0.6) + 's';
        container.appendChild(note);
        setTimeout(() => note.remove(), 3000 + delay * 1000);
      });
    }

    function startExplosion() {
      if (explosionInterval) return;
      isMusicPlaying = true;
      spawnExplosion();
      explosionInterval = setInterval(spawnExplosion, 1200);
    }

    function stopExplosion() {
      isMusicPlaying = false;
      if (explosionInterval) {
        clearInterval(explosionInterval);
        explosionInterval = null;
      }
      document.querySelectorAll('.explosion-note').forEach(el => el.remove());
    }

    // ========== UPDATE MUSIC BOX BACKGROUND ==========
    function updateMusicBoxBackground(characterType) {
      const box = document.getElementById('musicBox');
      box.classList.remove('mermaid', 'fairy', 'boy');
      if (characterType === 'fairy') box.classList.add('fairy');
      else if (characterType === 'boy' || characterType === 'human') box.classList.add('boy');
      else box.classList.add('mermaid');
      currentCharacter = characterType;
      setMusicTitle(characterType);
    }

    // ========== LISTEN FOR PARENT MESSAGES ==========
    window.addEventListener('message', function(event) {
      const data = event.data;
      if (data.action === 'musicPlay') startExplosion();
      if (data.action === 'musicStop') stopExplosion();
      if (data.action === 'musicMute') {
        document.getElementById('melodyBtn').classList.add('muted');
        stopExplosion();
      }
      if (data.action === 'musicUnmute') {
        document.getElementById('melodyBtn').classList.remove('muted');
        if (isMusicPlaying) startExplosion();
      }
      if (data.action === 'updateMusicBox') {
        updateMusicBoxBackground(data.character);
      }
    });

    // ========== FORWARD BUTTON CLICKS ==========
    document.getElementById('musicPrev').addEventListener('click', function() {
      window.parent.postMessage({ action: 'musicPrev' }, '*');
    });
    document.getElementById('musicNext').addEventListener('click', function() {
      window.parent.postMessage({ action: 'musicNext' }, '*');
    });
    document.getElementById('melodyBtn').addEventListener('click', function() {
      window.parent.postMessage({ action: 'musicToggle' }, '*');
    });

    // ========== TELL PARENT READY ==========
    window.parent.postMessage({ action: 'musicBoxReady' }, '*');
    console.log('🎵 Music box with floating notes (like sparkle) ready!');
  </script>
</body>
</html>
