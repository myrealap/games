<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zoom'n Groom - Myrealap</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      /* Prevent pull-to-refresh / rubber-banding from fighting the game */
      overscroll-behavior: none;
      touch-action: none;
    }

    /* Full-viewport black stage — this is the letterbox color, shown on
       whichever side (top/bottom or left/right) isn't the limiting
       dimension. Change this if you want a different letterbox color. */
    #mobileStage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* The game always renders at its true 1920x1080 — never resized —
       so every vw/vh-based rule inside index.html's CSS keeps computing
       against that same fixed resolution regardless of device. Only the
       CSS transform below changes how big it LOOKS on screen. */
    #gameFrame {
      width: 1920px;
      height: 1080px;
      border: none;
      flex-shrink: 0;
      transform-origin: center center;
    }
  </style>
</head>
<body>

  <div id="mobileStage">
    <iframe id="gameFrame" src="index.html" allow="autoplay"></iframe>
  </div>

  <script>
    var GAME_WIDTH = 1920;
    var GAME_HEIGHT = 1080;
    var frame = document.getElementById('gameFrame');

    function fitFrame() {
      var vw = window.innerWidth;
      var vh = window.innerHeight;

      // "Contain" scaling: whichever axis is more limiting sets the
      // scale, so the full 1920x1080 game always fits on screen with
      // its exact aspect ratio kept intact.
      //   - Portrait phone (narrow, tall): width is usually the limit
      //     -> game fills the full width, letterboxed top/bottom.
      //   - Landscape phone (wide, short): height is usually the limit
      //     -> game fills the full height, letterboxed left/right.
      var scale = Math.min(vw / GAME_WIDTH, vh / GAME_HEIGHT);
      frame.style.transform = 'scale(' + scale + ')';
    }

    window.addEventListener('resize', fitFrame);
    window.addEventListener('orientationchange', fitFrame);
    fitFrame();
  </script>

</body>
</html>
